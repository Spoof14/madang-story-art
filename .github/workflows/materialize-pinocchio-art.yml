name: materialize-pinocchio-art

# Temporary host URLs expire, so this job copies the cel JPEGs into git immediately.
on:
  push:
    branches:
      - cursor/pinocchio-cel-fdad
    paths:
      - story-art/_b64/READY

permissions:
  contents: write

concurrency:
  group: materialize-pinocchio-art
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download cel JPEGs
        run: |
          set -euo pipefail
          test -f story-art/_b64/URLS
          test -f story-art/_b64/FINAL
          mkdir -p story-art
          while read -r name url sha size; do
            [ -z "${name:-}" ] && continue
            curl -fsSL --retry 5 --retry-delay 2 --max-time 120 -o "story-art/$name" "$url"
            python3 -c 'import hashlib,pathlib,sys; name,sha,size=sys.argv[1:]; data=pathlib.Path("story-art",name).read_bytes(); assert data.startswith(bytes([255,216,255])), name; got=hashlib.sha1(data).hexdigest(); assert got==sha and len(data)==int(size), (name,got,len(data),sha,size); print(name,len(data),got)' "$name" "$sha" "$size"
          done < story-art/_b64/URLS
          count=$(find story-art -maxdepth 1 -name 'pinocchio-*.jpg' | wc -l)
          test "$count" -eq 41

      - name: Commit JPEGs and remove the uploader
        run: |
          set -euo pipefail
          rm -rf story-art/_b64
          rm -f story-art/.tiny-test.jpg story-art/.tiny-b64.jpg story-art/.pinocchio-write-test story-art/.tiny-probe.jpg
          rm -f .github/workflows/materialize-pinocchio-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add classic cel Pinocchio illustrations"
          git push origin HEAD:cursor/pinocchio-cel-fdad
