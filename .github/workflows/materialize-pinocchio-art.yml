name: materialize-pinocchio-art

# GitHub file writes are text-only, so cel JPEGs arrive as base64.
# This workflow writes the real bytes, then deletes itself when FINAL is present.
on:
  push:
    branches:
      - cursor/pinocchio-cel-fdad
    paths:
      - story-art/_b64/READY

permissions:
  contents: write

concurrency:
  group: materialize-pinocchio-art
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pinocchio-cel-fdad
      - name: Decode base64 JPEGs into story-art
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(story-art/_b64/*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no base64 payloads"
            exit 0
          fi
          final=0
          if [ -f story-art/_b64/FINAL ]; then
            final=1
          fi
          mkdir -p story-art
          for f in "${files[@]}"; do
            name=$(basename "$f" .b64)
            base64 -d "$f" > "story-art/$name"
            python3 -c 'import pathlib,sys; name=sys.argv[1]; data=pathlib.Path("story-art", name).read_bytes(); assert data.startswith(b"\xff\xd8\xff"), name; print(name, len(data))' "$name"
          done
          rm -f story-art/_b64/*.b64 story-art/_b64/READY story-art/_b64/FINAL story-art/_b64/SHA1
          rm -f story-art/.tiny-test.jpg story-art/.tiny-b64.jpg story-art/.pinocchio-write-test
          if [ "$final" = 1 ]; then
            rm -rf story-art/_b64
            rm -f .github/workflows/materialize-pinocchio-art.yml
          fi
          rmdir story-art/_b64 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add classic cel Pinocchio illustrations"
          git push origin HEAD:cursor/pinocchio-cel-fdad
